name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint deps
        run: pip install ruff mypy

      - name: Lint with ruff
        run: ruff check .

      - name: Install test deps
        run: |
          pip install pytest pytest-cov pydantic python-dotenv datasets

      - name: Install package in editable mode
        run: pip install -e . --no-deps

      - name: Run tests
        run: pytest tests/ -v --cov=data --cov-report=term-missing
