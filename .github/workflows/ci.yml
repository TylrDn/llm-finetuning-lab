name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov pyyaml python-dotenv datasets pydantic

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: >
          pytest tests/ -v
          --cov=data
          --cov=evals
          --cov=nemo
          --cov=training
          --cov=export
          --cov-report=term-missing
          --cov-fail-under=80
