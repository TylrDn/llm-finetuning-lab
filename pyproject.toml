[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "llm-finetuning-lab"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = [
    "training/lora_train.py",
    "training/dpo_train.py",
    "export/convert_gguf.py",
    "export/push_to_hub.py",
    "export/merge_and_export.py",
    "evals/mmlu_eval.py",
    "evals/hellaswag_eval.py",
    "nemo/nemo_finetune.py",
]
