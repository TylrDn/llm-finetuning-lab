base_model: meta-llama/Meta-Llama-3-8B
output_dir: ./outputs/lora

lora:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM

training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  fp16: false
  bf16: true
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  max_seq_length: 2048
  report_to: wandb
